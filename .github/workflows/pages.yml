name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.2
  MDBOOK_KATEX_VERSION: 0.10.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # mdbook-katex publishes no release binaries, so build it once per version.
      - name: Cache mdbook-katex
        id: katex-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook-katex
          key: mdbook-katex-${{ env.MDBOOK_KATEX_VERSION }}-${{ runner.os }}

      - name: Install mdbook-katex
        if: steps.katex-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook-katex --version "${MDBOOK_KATEX_VERSION}" --locked

      - name: Build book
        run: mdbook build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
